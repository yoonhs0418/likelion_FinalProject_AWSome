# 실제 배포 시 이 파일을 복사해 bank-backend-secret.yaml을 만들고 값을 채운 뒤 적용하세요.
# bank-backend-secret.yaml은 커밋하지 않습니다. (.gitignore 참고)
#
#   kubectl apply -f bank-backend-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: bank-backend-secret
  namespace: bank-namespace
type: Opaque
stringData:
  mysql-host: <RDS_ENDPOINT>
  mysql-user: <MYSQL_USER>
  mysql-password: <MYSQL_PASSWORD>
  redis-secret: <REDIS_SECRET>
