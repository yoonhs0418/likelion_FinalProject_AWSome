apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-server
  namespace: bank-namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
      - name: my-registry-secret
      containers:
      - name: backend
        image: nexus.mycluster.shop:5000/node-backend:v0.0.1
        imagePullPolicy: Always
        env:
        - name: PORT
          value: "8000"
        - name: NODE_ENV
          value: "notproduction"
        - name: MYSQL_HOST
          valueFrom:
            secretKeyRef:
              name: bank-backend-secret
              key: mysql-host
        - name: MYSQL_PORT
          value: "3306"
        - name: MYSQL_DATABASE
          value: "mybank"
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: bank-backend-secret
              key: mysql-user
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bank-backend-secret
              key: mysql-password
        - name: REDIS_HOST
          value: "team1-jake.lion.nyhhs.com"
        - name: REDIS_PORT
          value: "30379"
        - name: REDIS_SECRET
          valueFrom:
            secretKeyRef:
              name: bank-backend-secret
              key: redis-secret
        ports:
        - containerPort: 8000
      - name: istio-proxy
        image: nexus.mycluster.shop:5000/istio-proxy:latest
        ports:
        - containerPort: 15000
